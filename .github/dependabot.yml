version: 2

updates:
  # Root pnpm workspace, including the packages declared in pnpm-workspace.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    ignore:
      # Paquet interne au dépôt (packages/discord-types) : la version publiée sur npm est en retard et casse la compilation
      - dependency-name: "@vencord/discord-types"
      # La v7 ajoute les règles du React Compiler, incompatibles avec le cœur de Vencord
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      # @types/react 19.3 casse 59 types dans les composants (Button, BaseText...) : bloque en 19.2 dans pnpm-workspace.yaml
      - dependency-name: "@types/react"
        versions: [">=19.3.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.3.0"]
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
